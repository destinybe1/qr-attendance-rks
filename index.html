<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สแกน QR เข้าเรียนด้วยกล้อง | โรงเรียนร่องคำ</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#18334c;background:#eef4fb}
*{box-sizing:border-box}
body{margin:0;padding:22px}
.card{max-width:510px;margin:auto;padding:25px;background:#fff;border-radius:18px;box-shadow:0 4px 20px #18334c15}
.brand{text-align:center;margin-bottom:20px}
.school-logo{display:block;width:88px;height:88px;object-fit:contain;margin:0 auto 10px}
.school-name{font-size:15px;font-weight:700;color:#47637c;margin:0 0 6px}
h1{font-size:24px;margin:0}
video{width:100%;border-radius:12px;background:#20364b;aspect-ratio:4/3;object-fit:cover}
button{width:100%;padding:13px;background:#17649d;color:white;border:0;border-radius:10px;font:inherit;font-weight:600;margin:15px 0;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{color:#a53b33}
p{line-height:1.65}
@media(max-width:520px){body{padding:16px}.card{padding:20px}.school-logo{width:80px;height:80px}h1{font-size:22px}}
</style>
</head>
<body>
<main class="card">
  <header class="brand">
    <img class="school-logo" src="./logo_rks.jpg" alt="ตราโรงเรียนร่องคำ" width="88" height="88">
    <p class="school-name">โรงเรียนร่องคำ</p>
    <h1>สแกน QR Code เช็กชื่อ</h1>
  </header>
  <p>กดเปิดกล้อง แล้วส่อง QR Code ที่ครูฉายหน้าห้องเรียน ระบบไม่รองรับการเลือกภาพจากแกลเลอรี</p>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas" hidden></canvas>
  <button id="start" type="button">เปิดกล้องเพื่อสแกน</button>
  <p id="msg" role="status">โปรดอนุญาตให้เว็บไซต์เข้าถึงกล้อง</p>
  <small>ต้องเปิดผ่าน HTTPS ใน Chrome หรือ Safari เวอร์ชันปัจจุบัน</small>
</main>
<script>
const v=document.querySelector('#video'),c=document.querySelector('#canvas'),msg=document.querySelector('#msg'),btn=document.querySelector('#start');let stream=null,locked=false;
function validTarget(text){try{const u=new URL(text);return u.protocol==='https:' && (u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com') && u.pathname.includes('/macros/') && u.searchParams.get('page')==='student' && /^v1\.[a-z0-9-]+\.\d+\.[A-Za-z0-9_-]+$/.test(u.searchParams.get('qr')||'');}catch{return false;}}
async function start(){try{btn.disabled=true;if(!navigator.mediaDevices?.getUserMedia)throw Error('เบราว์เซอร์นี้ไม่อนุญาตให้เปิดกล้อง กรุณาใช้ HTTPS');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});v.srcObject=stream;await v.play();msg.textContent='กำลังสแกนจากภาพกล้อง...';requestAnimationFrame(tick);}catch(e){msg.textContent='เปิดกล้องไม่ได้: '+e.message;btn.disabled=false;}}
function tick(){if(locked)return;if(v.readyState>=2&&v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0);const data=ctx.getImageData(0,0,c.width,c.height);if(typeof jsQR==='function'){const res=jsQR(data.data,c.width,c.height,{inversionAttempts:'dontInvert'});if(res){if(validTarget(res.data)){locked=true;msg.textContent='ตรวจพบ QR Code กำลังเปิดแบบฟอร์ม...';stream?.getTracks().forEach(t=>t.stop());window.location.assign(res.data);return;}else{msg.textContent='QR Code ไม่ใช่รหัสเช็กชื่อของระบบนี้';}}}else{msg.textContent='โหลดไลบรารีสแกนไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต';return;}}requestAnimationFrame(tick);}
btn.addEventListener('click',start);window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script>
</body>
</html>
